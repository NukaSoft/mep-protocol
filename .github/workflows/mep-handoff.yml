name: MEP handoff

on:
  push:
    paths:
      - "examples/**/handoff.md"
      - "tests/handoff/**"
      - "scripts/check-handoff.py"
      - ".github/workflows/mep-handoff.yml"
  pull_request:
    paths:
      - "examples/**/handoff.md"
      - "tests/handoff/**"
      - "scripts/check-handoff.py"
      - ".github/workflows/mep-handoff.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance fixtures and examples
        run: python3 scripts/check-handoff.py --ci
